name: Frontend CI

on:
  push:
    branches:
      - "**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Lint + Build + Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npx eslint "src/**/*.{ts,tsx}"

      - name: Build frontend
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser and OS deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  frontend-quality-gate:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - frontend-ci
    steps:
      - name: Validate frontend result
        run: |
          RESULT="${{ needs.frontend-ci.result }}"
          echo "frontend-ci: ${RESULT}"
          if [[ "${RESULT}" == "failure" || "${RESULT}" == "cancelled" ]]; then
            echo "Frontend CI failed."
            exit 1
          fi
          echo "Frontend quality gate passed."
