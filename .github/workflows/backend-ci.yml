name: Backend CI

on:
  push:
    branches: [develop, main]

  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/backend-ci.yml"

  backend-quality:
    name: Lint + Unit Tests + Coverage + E2E
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testdb
      DB_USERNAME: test
      DB_PASSWORD: test
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/testdb
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL service on 127.0.0.1:3306..."
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1; then
              echo "MySQL is reachable."
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become reachable in time."
          exit 1

      - name: Sync Prisma schema
        run: npx prisma db push --skip-generate

      - name: Lint backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Run backend unit tests
        run: npm run test

      - name: Run backend coverage
        run: npm run test:cov

      - name: Run backend e2e tests
        run: npm run test:e2e:ci

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

      - name: Add backend coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'backend/coverage/coverage-summary.json';
            if (!fs.existsSync(path)) {
              core.info('coverage-summary.json not found, skipping PR comment');
              return;
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const total = data.total || {};
            const pct = (k) => total[k] ? `${total[k].pct}%` : 'n/a';
            const body = [
              '### Backend Coverage Summary',
              '',
              '| Metric | Coverage |',
              '|---|---:|',
              `| Lines | ${pct('lines')} |`,
              `| Statements | ${pct('statements')} |`,
              `| Functions | ${pct('functions')} |`,
              `| Branches | ${pct('branches')} |`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  backend-docker-build:
    name: Docker Build (No Push)
    needs: 
      - check-changes
      - backend-quality
    if: |
      always() && 
      needs.check-changes.outputs.backend == 'true' && 
      (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - check-changes
      - backend-quality
      - backend-docker-build
    steps:
      - name: Validate backend result
        run: |
          HAS_CHANGES="${{ needs.check-changes.outputs.backend }}"
          QUALITY_RESULT="${{ needs.backend-quality.result }}"
          DOCKER_RESULT="${{ needs.backend-docker-build.result }}"

          echo "Changes detected: ${HAS_CHANGES}"
          echo "backend-quality: ${QUALITY_RESULT}"
          echo "backend-docker-build: ${DOCKER_RESULT}"

          if [[ "${HAS_CHANGES}" == "false" ]]; then
            echo "No backend changes detected. Quality gate skipped (Success)."
            exit 0
          fi

          if [[ "${QUALITY_RESULT}" == "failure" || "${QUALITY_RESULT}" == "cancelled" ]]; then
            echo "Backend quality checks failed or were cancelled."
            exit 1
          fi

          if [[ "${DOCKER_RESULT}" == "failure" || "${DOCKER_RESULT}" == "cancelled" ]]; then
            echo "Backend Docker build failed or was cancelled."
            exit 1
          fi

          echo "Backend quality gate passed."

